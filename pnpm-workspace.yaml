# pnpm settings (single-package repo).
# esbuild's install script is unnecessary here: its native binary ships inside
# the @esbuild/<platform> package; the script only validates it. Recorded via
# `pnpm approve-builds` so installs pass cleanly (ERR_PNPM_IGNORED_BUILDS
# otherwise fails the Docker build).
allowBuilds:
  esbuild: false
